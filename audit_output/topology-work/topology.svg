<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="1400" height="760" fill="#f7f8fa"/>
<text x="700" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#18212b">Runtime iFogSim topology inventory</text>
<text x="700" y="72" text-anchor="middle" font-family="Arial" font-size="16" fill="#506070">Generated from TOPOLOGY_INVENTORY.json; Python is external control plane</text>
<line x1='165' y1='365' x2='165' y2='365' stroke='#506070' stroke-width='4'/>
<text x='165' y='353' text-anchor='middle' font-family='Arial' font-size='15' fill='#303b46'>unknown ms; Controller-derived</text>
<rect x="420" y="485" width="560" height="78" rx="12" fill="#ffffff" stroke="#7a4d9e" stroke-width="3" stroke-dasharray="9,7"/>
<text x="700" y="518" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#18212b">Python RL JSONL service</text>
<text x="700" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#506070">observation -&gt; action -&gt; outcome; external control plane, not a FogDevice</text>
<line x1="700" y1="485" x2="700" y2="365" stroke="#7a4d9e" stroke-width="3" stroke-dasharray="9,7"/>
<text x="55" y="625" font-family="Arial" font-size="16" font-weight="bold" fill="#18212b">Task paths</text>
<text x="55" y="651" font-family="Arial" font-size="14" fill="#303b46">Local: execute at local, no counted parent-child transfer</text>
<text x="55" y="675" font-family="Arial" font-size="14" fill="#303b46">Edge: local -&gt; edge input, edge -&gt; local result</text>
<text x="55" y="699" font-family="Arial" font-size="14" fill="#303b46">Cloud: local -&gt; edge -&gt; cloud input, then reverse result path</text>
<text x="850" y="625" font-family="Arial" font-size="16" font-weight="bold" fill="#18212b">Legend</text>
<text x="850" y="651" font-family="Arial" font-size="14" fill="#303b46">MIPS = million instructions per second; RAM/storage = simulator units</text>
<text x="850" y="675" font-family="Arial" font-size="14" fill="#303b46">PE = processing element; BW = configured device/host bandwidth</text>
<text x="850" y="699" font-family="Arial" font-size="14" fill="#303b46">Latency = effective simulator link latency in ms</text>
</svg>
