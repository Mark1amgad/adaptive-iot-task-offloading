[project]
name = "rl_model"
version = "1.0.0"
description = "Tabular Q-Learning offloading agent (Local/Edge/Cloud) for an iFogSim experiment"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
