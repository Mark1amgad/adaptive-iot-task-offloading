name: Abdo industrial workload pipeline

on:
  push:
    branches:
      - abdo/industrial-workload-replay-seed-v2
  pull_request:
    branches:
      - mark/iiot-scope-transition-v1
    paths:
      - "team-work/Astta-Abdo/**"
      - "research/experiments/SEED_REGISTRY_V2.csv"
      - ".github/workflows/abdo-workload-generator.yml"

permissions:
  contents: read

jobs:
  verify-and-generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team-work/Astta-Abdo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: team-work/Astta-Abdo/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate eight registered development scenarios
        run: |
          find data/dev -maxdepth 1 -type f \( -name "*_tasks.csv" -o -name "*_scenario_manifest.csv" \) -delete
          python scripts/generate_workloads.py \
            --scenario all-core \
            --dataset-split development \
            --seed 1300 \
            --seed-count 1 \
            --task-count 48 \
            --output data/dev \
            --hash-report reports/dev_hashes_v1_2.json

      - name: Validate every task/manifest pair including replay
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for tasks in data/dev/*_tasks.csv; do
            manifest="${tasks%_tasks.csv}_scenario_manifest.csv"
            stem="$(basename "${tasks%_tasks.csv}")"
            python scripts/validate_dataset.py \
              --tasks "$tasks" \
              --manifest "$manifest" \
              --check-replay \
              --report "reports/${stem}_validation.json"
            count=$((count + 1))
          done
          test "$count" -eq 8

      - name: Run automated tests
        run: python -m pytest -q

      - name: Upload generated data and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abdo-industrial-workload-dev-v1-2
          path: |
            team-work/Astta-Abdo/data/dev/
            team-work/Astta-Abdo/reports/
            research/experiments/SEED_REGISTRY_V2.csv
          if-no-files-found: error
          include-hidden-files: true
